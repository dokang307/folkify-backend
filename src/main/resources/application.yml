server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/folkify}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: ${MAX_UPLOAD_FILE_SIZE:26MB}
      max-request-size: ${MAX_UPLOAD_REQUEST_SIZE:27MB}

  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

r2:
  account-id: ${R2_ACCOUNT_ID}
  access-key-id: ${R2_ACCESS_KEY_ID}
  secret-access-key: ${R2_SECRET_ACCESS_KEY}
  bucket-name: ${R2_BUCKET_NAME}
  public-url: ${R2_PUBLIC_URL}

payos:
  client-id: ${PAYOS_CLIENT_ID:}
  api-key: ${PAYOS_API_KEY:}
  checksum-key: ${PAYOS_CHECKSUM_KEY:}
  return-url: ${PAYOS_RETURN_URL:http://localhost:8080/api/payments/result}
  cancel-url: ${PAYOS_CANCEL_URL:http://localhost:8080/api/payments/result}
  web-return-url: ${PAYOS_WEB_RETURN_URL:http://localhost:3001/pricing/result}
  web-cancel-url: ${PAYOS_WEB_CANCEL_URL:http://localhost:3001/pricing/result}
  plan-duration-days: ${PAYOS_PLAN_DURATION_DAYS:30}
  plan-prices:
    BASIC: ${PAYOS_PRICE_BASIC:49000}
    PRO: ${PAYOS_PRICE_PRO:99000}

app:
  jwt:
    secret: ${JWT_SECRET:folkify-super-secret-key-change-this-in-production-must-be-256-bits}
    access-token-expiration: ${JWT_ACCESS_EXPIRATION:900000}
    refresh-token-expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  mail:
    from: ${MAIL_FROM:noreply@folkify.vn}
  reset-password:
    expiration: ${RESET_PASSWORD_EXPIRATION:3600000}
  base-url: ${BASE_URL:http://localhost:8080}
  deep-link:
    base-url: ${DEEP_LINK_BASE_URL:folkify:///reset-password}

folkify:
  entitlement:
    ai-monthly-quota:
      FREE: ${AI_QUOTA_FREE:0}
      BASIC: ${AI_QUOTA_BASIC:10}
      PRO: ${AI_QUOTA_PRO:50}
    history-days:
      FREE: ${AI_HISTORY_DAYS_FREE:30}
      BASIC: ${AI_HISTORY_DAYS_BASIC:30}
  quiz:
    pass-percent: ${QUIZ_PASS_PERCENT:70}
  ai:
    base-url: ${AI_SERVICE_URL:http://localhost:8000}
    # Bản ghi tới 6 phút: pyin + DTW có thể mất cả phút trên CPU yếu
    timeout-ms: ${AI_SERVICE_TIMEOUT_MS:180000}
    max-upload-bytes: ${AI_MAX_UPLOAD_BYTES:26214400}
    max-page-size: ${AI_HISTORY_MAX_PAGE_SIZE:50}
